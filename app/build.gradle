plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voiceassistant.app'
    compileSdk 35  // 更新到35以支持最新的16KB页面大小要求

    defaultConfig {
        applicationId "com.voiceassistant.app"
        minSdk 21
        targetSdk 35  // 更新target SDK以支持16KB页面大小
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 支持16KB页大小
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // 外部Native构建选项
        externalNativeBuild {
            cmake {
                cppFlags "-fPIC"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    packagingOptions {
        // 确保native库对齐到16KB边界
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += ['**/*.so']
        }

        // 处理重复的库文件
        pickFirsts.add('lib/arm64-v8a/libc++_shared.so')
        pickFirsts.add('lib/armeabi-v7a/libc++_shared.so')
        pickFirsts.add('lib/x86/libc++_shared.so')
        pickFirsts.add('lib/x86_64/libc++_shared.so')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Android核心库
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // 架构组件
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    
    // 语音识别 - Vosk
    implementation 'com.alphacephei:vosk-android:0.3.47'

    // 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // 权限处理
    implementation 'com.github.permissions-dispatcher:permissionsdispatcher:4.9.2'
    annotationProcessor 'com.github.permissions-dispatcher:permissionsdispatcher-processor:4.9.2'
    
    // 测试
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
